name: ApplyFlow checks

on:
  push:
    paths:
      - '**'
      - '.github/workflows/applyflow-tests.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/applyflow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax checks and unit tests
        run: npm run check
